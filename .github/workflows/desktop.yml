---
# Moonlight Desktop: build, test and package on Windows. A "v*" tag also publishes
# the installers to that release (the tag must match app/desktop-version.txt).
name: Moonlight Desktop
permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    permissions:
      contents: write  # release upload on tags
    defaults:
      run:
        shell: pwsh
    steps:
      # Same layout as on a developer PC: <root>\scripts, <root>\moonlight-qt, <root>\tools
      - name: Checkout build scripts
        uses: actions/checkout@v5
        with:
          repository: emog33k/moonlight-desktop-build
          path: root

      - name: Checkout Moonlight Desktop
        uses: actions/checkout@v5
        with:
          path: root/moonlight-qt
          submodules: recursive
          fetch-depth: 1

      - name: Check the version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Get-Content root/moonlight-qt/app/desktop-version.txt -TotalCount 1).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app/desktop-version.txt ($version)"
          }

      - name: Download dependencies
        working-directory: root/moonlight-qt
        run: ./setup-deps.ps1

      # Qt from download.qt.io by our own script (every archive checked against its
      # published checksum); aqtinstall fails on the current repository layout
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: root/tools/Qt
          key: qt-6.11.3-msvc2022_64-${{ hashFiles('root/scripts/fetch-qt.ps1') }}

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: ./root/scripts/fetch-qt.ps1

      - name: Install NSIS
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Build, test and package
        shell: cmd
        run: root\scripts\make-installers.bat

      - name: Name and checksum the files
        working-directory: root/dist
        run: |
          $version = (Get-Content ../moonlight-qt/app/desktop-version.txt -TotalCount 1).Trim()
          Get-ChildItem MoonlightDesktop-Portable-*.zip | Rename-Item -NewName "MoonlightDesktop-Portable-$version.zip"
          Get-FileHash *.exe, *.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower()) *$(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload the files
        uses: actions/upload-artifact@v6
        with:
          name: MoonlightDesktop-${{ github.sha }}
          path: root/dist/*
          if-no-files-found: error

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: root/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem *.exe, *.zip, SHA256SUMS.txt | ForEach-Object { $_.Name }
          gh release view $tag -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber -R $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag @files --title "Moonlight Desktop $($tag.TrimStart('v'))" --generate-notes -R $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
